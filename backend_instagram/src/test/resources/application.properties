# Test configuration with Testcontainers MySQL
# This will be overridden by Testcontainers at runtime
spring.datasource.url=jdbc:tc:mysql:8.0:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT config for tests
tenit.jwt.base64-secret=dGVzdC1vbmx5LWp3dC1rZXktMzItYnl0ZXMtZXhhY3RseSE=
tenit.jwt.token-validity-in-seconds=3600
tenit.jwt.refresh-token-validity-in-seconds=7200

# Disable websocket for tests
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=65536

# Disable external services
gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Logging for tests
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.testcontainers=WARN