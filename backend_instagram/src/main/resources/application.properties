# Cấu hình tải lên multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1MB

# Cấu hình Tomcat
server.tomcat.max-swallow-size=-1

server.port=${SERVER_PORT:8081}
spring.application.name=backend_instagram
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART:false}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:backend_instagram}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
##cấu hình jwt
# Base64 secret key
tenit.jwt.base64-secret=${JWT_BASE64_SECRET}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# JWT token validity time in seconds
tenit.jwt.token-validity-in-seconds=${JWT_TOKEN_VALIDITY_SECONDS:1000000000}
tenit.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1000000000}

app.auth-cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth-cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

aws.access-key-id=${ACCESS_KEY:test}
aws.secret-access-key=${SECRET_KEY:test}
aws.region=${REGION:ap-southeast-1}
aws.s3.bucket=${BUCKET_NAME:instagram-media}
aws.s3.endpoint=${S3_ENDPOINT:}
aws.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Thêm cấu hình WebSocket
spring.mvc.async.request-timeout=30000

# Nếu cần tăng kích thước tin nhắn
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=65536


gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

