apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app: localstack
    app.kubernetes.io/part-of: instagram
spec:
  type: ClusterIP
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app: localstack
    app.kubernetes.io/part-of: instagram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
        app.kubernetes.io/part-of: instagram
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.14.0
          ports:
            - name: edge
              containerPort: 4566
          env:
            - name: SERVICES
              value: s3
            - name: EDGE_PORT
              value: "4566"
            - name: DEFAULT_REGION
              value: ap-southeast-1
            - name: PERSISTENCE
              value: "1"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
      volumes:
        - name: data
          emptyDir: {}
---
# Tạo bucket S3 và bucket policy public-read sau khi LocalStack sẵn sàng.
apiVersion: batch/v1
kind: Job
metadata:
  name: localstack-init
  labels:
    app: localstack-init
    app.kubernetes.io/part-of: instagram
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: localstack-init
        app.kubernetes.io/part-of: instagram
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.15.57
          env:
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: SECRET_KEY
            - name: S3_ENDPOINT
              value: http://localstack:4566
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: BUCKET_NAME
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Chờ LocalStack sẵn sàng..."
              until aws --endpoint-url "$S3_ENDPOINT" s3api list-buckets >/dev/null 2>&1; do
                sleep 3
              done
              if ! aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$BUCKET_NAME" >/dev/null 2>&1; then
                aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://$BUCKET_NAME"
              fi
              aws --endpoint-url "$S3_ENDPOINT" s3api put-bucket-policy \
                --bucket "$BUCKET_NAME" \
                --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$BUCKET_NAME/*\"}]}"
              echo "Bucket $BUCKET_NAME đã sẵn sàng."
