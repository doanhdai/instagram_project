apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo
  labels:
    app: seed-demo
    app.kubernetes.io/part-of: instagram
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: seed-demo
        app.kubernetes.io/part-of: instagram
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Chờ backend tạo bảng (ddl-auto=update) trước khi chạy seed
        - name: wait-for-schema
          image: mysql:8.0
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: DB_USERNAME
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: DB_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql --protocol=tcp -h "$DB_HOST" -u"$DB_USERNAME" -e "SELECT 1 FROM users LIMIT 1" "$DB_NAME" >/dev/null 2>&1; do
                echo "Chờ backend tạo schema..."
                sleep 5
              done
              echo "Schema đã sẵn sàng."
      containers:
        - name: seed
          image: mysql:8.0
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: instagram-config
                  key: DB_USERNAME
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: DB_PASSWORD
          command:
            - /bin/sh
            - -c
            - mysql --protocol=tcp -h "$DB_HOST" -u"$DB_USERNAME" "$DB_NAME" < /seed/seed-demo.sql
          volumeMounts:
            - name: seed-sql
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed-sql
          configMap:
            name: seed-demo-sql
