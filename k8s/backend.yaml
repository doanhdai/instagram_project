apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/part-of: instagram
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/part-of: instagram
spec:
  # Giữ 1 replica mặc định: STOMP simple broker không chia sẻ message giữa các pod.
  # Tăng lên 2+ sau khi bật Redis pub/sub (xem README phần Hạn chế đã biết).
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: instagram
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Chờ MySQL và Redis sẵn sàng trước khi Spring Boot khởi động
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until nc -z mysql 3306; do echo "Chờ MySQL..."; sleep 2; done
              until nc -z redis 6379; do echo "Chờ Redis..."; sleep 2; done
              echo "Dependencies đã sẵn sàng."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: backend
          image: instagram-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: instagram-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: DB_PASSWORD
            - name: JWT_BASE64_SECRET
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: JWT_BASE64_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: GEMINI_API_KEY
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: instagram-secrets
                  key: SECRET_KEY
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/part-of: instagram
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
