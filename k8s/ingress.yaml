apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: instagram
  labels:
    app.kubernetes.io/part-of: instagram
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: instagram.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# WebSocket (SockJS/STOMP) — NGINX Ingress hỗ trợ upgrade header mặc định,
# chỉ cần nới timeout cho kết nối dài.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: instagram-websocket
  labels:
    app.kubernetes.io/part-of: instagram
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: instagram.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
---
# Public read S3 qua LocalStack: /s3/instagram-media/<key> -> /instagram-media/<key>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: instagram-s3
  labels:
    app.kubernetes.io/part-of: instagram
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - host: instagram.local
      http:
        paths:
          - path: /s3(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: localstack
                port:
                  number: 4566
