# Mẫu secret cho Kubernetes. Không commit giá trị thật.
# Cách tạo nhanh từ file .env ở thư mục gốc:
#   ./k8s/create-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: instagram-secrets
  labels:
    app.kubernetes.io/part-of: instagram
type: Opaque
stringData:
  DB_ROOT_PASSWORD: change-me
  DB_PASSWORD: change-me
  JWT_BASE64_SECRET: change-me
  GEMINI_API_KEY: ""
  ACCESS_KEY: test
  SECRET_KEY: test
