services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-backend_instagram}
      MYSQL_USER: ${DB_USERNAME:-instagram_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-instagram_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      EDGE_PORT: 4566
      DEFAULT_REGION: ap-southeast-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend_instagram
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-backend_instagram}
      DB_USERNAME: ${DB_USERNAME:-instagram_user}
      DB_PASSWORD: ${DB_PASSWORD:-instagram_pass}
      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?Set JWT_BASE64_SECRET in the root .env file}
      JWT_TOKEN_VALIDITY_SECONDS: ${JWT_TOKEN_VALIDITY_SECONDS:-1000000000}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-1000000000}
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      ACCESS_KEY: test
      SECRET_KEY: test
      REGION: ap-southeast-1
      BUCKET_NAME: instagram-media
      S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  seed:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-backend_instagram}
      MYSQL_USER: ${DB_USERNAME:-instagram_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-instagram_pass}
      MYSQL_PWD: ${DB_PASSWORD:-instagram_pass}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mysql --protocol=tcp -h mysql -u"${DB_USERNAME:-instagram_user}" "${DB_NAME:-backend_instagram}" < /seed-demo.sql'
    volumes:
      - ./backend_instagram/seed-demo.sql:/seed-demo.sql:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./Social-app-fontend
      args:
        REACT_APP_API_URL: http://localhost:8081
    ports:
      - "3000:80"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  localstack_data:
